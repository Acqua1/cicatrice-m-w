    .nav-link { position: relative; padding: 6px 2px; }

    .nav-item { position: relative; padding-bottom: 12px; /* enlarge hover area to bridge to dropdown */ }
    .nav-item > a { padding: 6px 2px; display: inline-block; }

    .dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      background: #fff;
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      border-radius: 8px;
      padding: 10px 12px;
      min-width: 220px;
      display: block; /* keep layout for smooth animation */
      opacity: 0;
      visibility: hidden;
      pointer-events: none; /* prevent interaction when hidden */
      transform: translateY(6px);
      transition: opacity 160ms ease, visibility 160ms ease, transform 160ms ease;
      z-index: 1200;
    }

    .dropdown a {
      display: block;
      padding: 8px 6px;
      color: #111;
      font-size: 14px;
      white-space: nowrap;
    }

    .dropdown a:hover { color: #666; }

    /* Instagram small preview next to link */
    .dropdown { position: absolute; }
    .dropdown .insta-preview {
      position: absolute;
      left: 100%;
      top: 0;
      margin-left: 10px;
      width: 160px;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      background: #fff;
      padding: 6px;
      display: none;
    }
    .dropdown .insta-preview.show { display: block; }

    /* Show dropdown on hover or focus-within for accessibility/mobile */
    .nav-item:hover .dropdown,
    .nav-item:focus-within .dropdown,
    .nav-item.open .dropdown {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .logo img {
      width: 90px;
      height: 90px;
      object-fit: contain;
    }

    main { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; }

    .page-title {
      text-align: center;
      margin: 24px 0 32px;
      font-size: 28px;
      letter-spacing: 1px;
      font-weight: 800;
      text-transform: uppercase;
    }

    /* Gallery grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      justify-items: center; /* ensure items centered within their cell */
    }

    .grid + .grid { margin-top: 22px; }

    .card { width: 100%; aspect-ratio: 1; position: relative; overflow: hidden; border-radius: 6px; }

    .image-wrapper { position: absolute; inset: 0; }

    .image-wrapper img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 0.5s ease; }

    .image-wrapper img.new { opacity: 0; }

    /* Modal/popup overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none; /* toggled by JS */
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 2000;
      overflow: auto; /* allow scrolling on small screens */
      -webkit-overflow-scrolling: touch;
    }

    .overlay.show { display: flex; }

    .popup {
      width: min(680px, 92vw);
      max-height: 85vh; /* ensure fits viewport */
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      padding: 24px 26px;
      line-height: 1.8;
      color: #222;
      overflow: auto; /* internal scroll when content is long */
      -webkit-overflow-scrolling: touch;
    }

    .popup h3 { margin: 0 0 12px; font-size: 20px; }
    .popup p { margin: 0; font-size: 15px; white-space: pre-line; }
    .popup img { max-width: 100%; height: auto; display: block; margin: 8px auto 0; border-radius: 6px; }

    /* Responsive */
    @media (max-width: 1200px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 520px) {
      .nav { padding: 12px 14px; }
      .nav-left { gap: 14px; }
      .page-title { font-size: 22px; letter-spacing: 0.5px; }
      .grid { grid-template-columns: 1fr; }
      .card { border-radius: 4px; }
      .popup { width: 94vw; max-height: 88vh; padding: 18px; }
      .overlay { padding: 12px; }
      .logo img { width: 90px; height: 90px; }
    }
  </style>

        text: "I was about seven years old when it happened — one of those blazing summer afternoons that seemed to stretch on forever. The sun scorched the pavement outside my grandma's house, and everything shimmered in the heat. I was restless and sticky with sweat when a sudden craving struck me: I wanted a popsicle. There was a tiny convenience store just next door. I remember the clinking sound of coins in my hand as I dashed out the door, excitement buzzing through me. But in my eager rush, I didn't notice the high step at the store's entrance. My foot caught, and in an instant, I was falling — the world flipping upside down before I hit the ground hard. Pain exploded across my body. Tears spilled out before I could stop them, and I cried loud and uncontrollably, not from embarrassment, but from the raw, stinging hurt. I don't remember the ride to the hospital, only flashes — the bright white of the walls, the sharp, clean smell of disinfectant, and voices muffled by panic. I ended up with seven stitches. It was my very first time in a hospital, and I had always imagined it as a place of fear, pain, and loneliness. But that day, it wasn't any of those things. I only remember my mother's arms around me, soft and warm, her voice steady and soothing. In that moment, the pain seemed to shrink, folded inside her embrace. That summer day, I learned that hospitals weren't so scary after all. Pain wasn't something to fear — it was something I could face, especially when I wasn't alone. And sometimes, the deepest comfort comes not from avoiding pain, but from being held through it."

was stunned. The crispness, the juice, the delicate sweetness—I couldn’t believe I had ever disliked it. It was in that moment I realized something that has stayed with me ever since: the things we take for granted are often the most precious. We don’t notice their worth until they’re gone. Just like the old Chinese saying goes: \"What comes easy is often taken lightly.\""

 inserted into my chest. I watched blood slowly trickle through it. That image stayed with me. The ordeal lasted an entire month. I lay in bed, day after day, feeling my body stitch itself back together while silently enduring the slow, stubborn pain. But during that time, something in me changed. That experience left a mark far deeper than the scar on my chest. I began to understand how delicate life truly is. I started to see each breath, each heartbeat, each ordinary moment, as a quiet miracle. We spend so much time chasing things—grades, goals, perfection—but all of it fades in front of the simple truth: life is fragile, and life is precious. Perhaps we can afford to let go of many things in life. But life and death are never ours to control. As the old saying goes, \"Life and death are governed by fate, not by our will.\""

    // If a data file provides items, rebuild the gallery dynamically
    function buildGalleryFromData(items) {
      if (!Array.isArray(items) || items.length === 0) return;
      const mainEl = document.querySelector('main');
      if (!mainEl) return;

      // Rebuild main with a single grid; responsive CSS already handles columns
      mainEl.innerHTML = `
        <h1 class="page-title">Where Scars Remember</h1>
        <section class="grid" aria-label="Gallery"></section>
      `;
      const grid = mainEl.querySelector('.grid');
      const frag = document.createDocumentFragment();

      items.forEach((it) => {
        const key = it.key || '';
        if (!key) return;
        // Update replacements mapping from data
        replacements[key] = {
          title: it.title || replacements[key]?.title || 'Where Scars Remember',
          text: it.text || replacements[key]?.text || '',
          img: it.overlay || replacements[key]?.img || undefined
        };

        const card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('data-key', key);
        card.innerHTML = `
          <div class="image-wrapper">
            <img class="original" src="${it.original || ''}" alt="${key}" />
            <img class="new" src="${it.overlay || it.original || ''}" alt="${key} new" />
          </div>
        `;
        frag.appendChild(card);
      });

      grid.appendChild(frag);
    }

    if (window.CICATRICE_ITEMS && Array.isArray(window.CICATRICE_ITEMS) && window.CICATRICE_ITEMS.length > 0) {
      buildGalleryFromData(window.CICATRICE_ITEMS);
    }

    const body = document.body;
    const overlay = document.getElementById('popupOverlay');
    const popupTitle = document.getElementById('popupTitle');
    const popupText = document.getElementById('popupText');
    const popupContent = document.getElementById('popupContent');
    let popupImage = document.getElementById('popupImage');

    function openPopup({ title = 'Where Scars Remember', text = '...', img = null } = {}) {
      popupTitle.textContent = title || '';
      popupText.textContent = text || '';
      // Handle optional image
      if (img) {
        if (!popupImage) {
          popupImage = document.createElement('img');
          popupImage.id = 'popupImage';
          popupContent.appendChild(popupImage);
        }
        popupImage.src = img;
        popupImage.style.display = 'block';
      } else if (popupImage) {
        popupImage.style.display = 'none';
        popupImage.removeAttribute('src');
      }
      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden', 'false');
      body.style.overflow = 'hidden';
    }

    function closePopup() {
      overlay.classList.remove('show');
      overlay.setAttribute('aria-hidden', 'true');
      body.style.overflow = '';
    }

    // Close when clicking outside popup
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) {
        closePopup();
      }
    });

    // Close on ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closePopup();
        closeAllNavDropdowns();
      }
    });

    // Nav: click-to-toggle dropdowns for mobile/desktop
    const navItems = Array.from(document.querySelectorAll('.nav-item'));
    const hideTimers = new WeakMap();
    function closeAllNavDropdowns(except = null) {
      navItems.forEach(it => { if (it !== except) it.classList.remove('open'); });
    }
    navItems.forEach(item => {
      const trigger = item.querySelector('a.nav-link');
      if (!trigger) return;
      trigger.addEventListener('click', (ev) => {
        ev.preventDefault();
        const isOpen = item.classList.contains('open');
        closeAllNavDropdowns(item);
        if (!isOpen) item.classList.add('open'); else item.classList.remove('open');
      });

      // Hover enter cancels pending hide
      item.addEventListener('mouseenter', () => {
        const t = hideTimers.get(item);
        if (t) { clearTimeout(t); hideTimers.delete(item); }
        item.classList.add('open');
      });
      // Hover leave schedules hide after 200ms
      item.addEventListener('mouseleave', () => {
        const t = setTimeout(() => {
          item.classList.remove('open');
          hideTimers.delete(item);
        }, 200);
        hideTimers.set(item, t);
      });
    });
    // Close dropdowns when clicking outside the nav
    document.addEventListener('click', (e) => {
      const nav = document.querySelector('header .nav');
      if (!nav.contains(e.target)) {
        closeAllNavDropdowns();
      }
    });

    // Instagram small preview toggle next to the link
    (function(){
      const igLink = document.getElementById('instagramLink');
      const igPreview = document.getElementById('instagramPreview');
      if (igLink && igPreview) {
        igLink.addEventListener('click', (e) => {
          e.preventDefault();
          igPreview.classList.toggle('show');
        });
        igPreview.addEventListener('click', (e) => {
          e.preventDefault();
          // open large image in modal
          openPopup({ title: 'Instagram', text: '', img: igPreview.getAttribute('src') });
        });
        // hide preview when clicking elsewhere
        document.addEventListener('click', (e) => {
          const dropdown = igLink.closest('.dropdown');
          if (dropdown && !dropdown.contains(e.target)) {
            igPreview.classList.remove('show');
          }
        });
      }
    })();

    // About dropdown: open popups for About This Website and Our Mission
    (function(){
      const aboutMenu = document.querySelector('.dropdown[aria-label="About Menu"]');
      if (!aboutMenu) return;
      const linkAbout = aboutMenu.querySelector('a[href="#about"]');
      const linkMission = aboutMenu.querySelector('a[href="#mission"]');
      if (linkAbout) {
        linkAbout.addEventListener('click', (e) => {
          e.preventDefault();
          closeAllNavDropdowns();
          openPopup({
            title: 'About This Website',
            text: 'Welcome to Ahia, a digital archive dedicated to preserving scars. Below, you can contact us to share your photos and stories—whether your scars are physical or emotional.'
          });
        });
      }
      if (linkMission) {
        linkMission.addEventListener('click', (e) => {
          e.preventDefault();
          closeAllNavDropdowns();
          openPopup({
            title: 'Our Mission',
            text: 'Every scar carries a story. Some speak of pain, others of healing—together, they shape who we are. This website aims to transform fear into empathy, revealing the beauty that can emerge from our wounds.'
          });
        });
      }
    })();

    // Event delegation for cards with 2-step cycle:
    // 1) first click -> show new AND open popup
    // 2) second click -> revert to original, then repeat
    document.addEventListener('click', (e) => {
      const card = e.target.closest('.card');
      if (!card) return;

      const key = card.getAttribute('data-key');
      const original = card.querySelector('img.original');
      const next = card.querySelector('img.new');

      // Ensure replacement image is prepared if provided
      const cfg = replacements[key] || null;
      if (cfg && cfg.img) {
        next.src = cfg.img;
      }

      const state = parseInt(card.dataset.cycle || '0', 10);
      if (state === 0) {
        // First click: show new and open popup
        next.style.opacity = '1';
        openPopup({ title: (cfg && cfg.title) || 'Where Scars Remember', text: (cfg && cfg.text) || 'Text will be provided.' });
        card.dataset.cycle = '1';
      } else {
        // Second click: revert to original
        next.style.opacity = '0';
        card.dataset.cycle = '0';
      }
    });
  </script>
